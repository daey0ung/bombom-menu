name: daily-menu-manual

# GH-300: workflow_dispatch는 사용자가 Run workflow 버튼을 눌렀을 때만 시작되는 Trigger다.
# schedule을 두지 않았으므로 정해진 시간에 자동 실행되지 않는다.
on:
  workflow_dispatch:

# GH-300 최소 권한 원칙: docs 결과를 현재 브랜치에 push하는 권한만 요청한다.
# Claude/OpenAI/Teams Secret은 사용하지 않으며 id-token 권한도 필요 없다.
permissions:
  contents: write

# 같은 브랜치에서 버튼을 여러 번 눌러도 한 번에 하나만 실행한다.
concurrency:
  group: daily-menu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # GH-300: Action은 외부 코드이므로 운영 환경에서는 commit SHA 고정도 검토한다.
      - name: Checkout selected branch
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ocr.txt

      # AI-103: 로컬 CPU 추론 엔진과 OCR 기능만 설치한다. 외부 AI API 요금은 없다.
      - name: Install free local OCR
        run: |
          python -m pip install paddlepaddle==3.2.0 \
            -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          python -m pip install -r requirements-ocr.txt

      # 첫 실행은 모델을 내려받고, 이후 실행은 캐시를 재사용한다.
      # GH-300: cache key가 바뀌면 새 캐시가 만들어지며 Secret은 캐시하면 안 된다.
      - name: Restore PaddleOCR model cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/paddlex-cache
          key: paddleocr-${{ runner.os }}-ppocrv5-mobile-det-korean-mobile-rec-v1

      - name: Fetch today's menu image
        id: fetch
        run: python scripts/fetch_menu.py

      # AB-100: OCR 실패를 전체 프로세스 실패로 만들지 않는 fallback 설계다.
      # JSON이 없으면 뒤의 검증/렌더 단계가 이미지 전용 결과를 만든다.
      - name: Read menu with PaddleOCR
        if: steps.fetch.outputs.found == 'true'
        continue-on-error: true
        env:
          PADDLE_PDX_CACHE_HOME: ${{ runner.temp }}/paddlex-cache
          PADDLE_PDX_MODEL_SOURCE: BOS
        run: |
          python scripts/ocr_menu.py \
            --image "docs/${{ steps.fetch.outputs.image_rel }}" \
            --date "${{ steps.fetch.outputs.date }}" \
            --output "docs/data/${{ steps.fetch.outputs.date }}.json"

      - name: Validate OCR output
        if: steps.fetch.outputs.found == 'true'
        run: python scripts/validate_menu.py

      - name: Render pages and readable summary
        if: steps.fetch.outputs.found == 'true'
        run: |
          python scripts/render.py
          python scripts/write_summary.py

      - name: Commit results to the selected branch
        if: steps.fetch.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "no changes to commit"
          else
            git commit -m "menu: ${{ steps.fetch.outputs.date }}"
            git push
          fi

      # Teams 단계는 의도적으로 없다. 테스트 완료 후 별도 승인으로 추가한다.
      - name: No-new-menu summary
        if: steps.fetch.outputs.found != 'true'
        run: |
          {
            echo "## 봄봄 메뉴"
            if [ "${{ steps.fetch.outputs.already }}" = "true" ]; then
              echo "오늘 메뉴는 이미 처리되어 있습니다."
            else
              echo "오늘 게시물이 없습니다."
            fi
            echo ""
            echo "Teams 알림은 현재 비활성화되어 있습니다."
          } >> "$GITHUB_STEP_SUMMARY"
